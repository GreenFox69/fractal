<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мандельброт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aurora" aria-hidden="true">
        <span class="orb orb-a"></span>
        <span class="orb orb-b"></span>
        <span class="orb orb-c"></span>
    </div>

    <div class="stage">
        <header class="glass bar">
            <div class="brand">
                <h1>Мандельброт</h1>
                <p>Множество на комплексной плоскости</p>
            </div>
            <p id="status" class="status">Ожидание</p>
        </header>

        <section class="glass frame">
            <canvas id="mandelbrot"></canvas>
        </section>

        <footer class="glass dock">
            <label class="slider" for="iterations">
                <span class="slider-label">
                    Точность
                    <strong id="iterations-label">80</strong>
                    <span class="unit">итераций</span>
                </span>
                <input id="iterations" type="range" min="20" max="500" step="10" value="80">
            </label>
            <div class="actions">
                <button type="button" id="zoom-in">Ближе</button>
                <button type="button" id="zoom-out">Дальше</button>
                <button type="button" id="reset">Сбросить</button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
