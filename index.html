<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandelbrot Fractal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="glass">
      <h1>Mandelbrot <span class="accent">Fractal</span></h1>
      <p>Фрактал Мандельброта · отрисовка в браузере</p>
    </header>

    <div class="stage glass">
      <canvas id="mandelbrot" aria-label="Mandelbrot fractal"></canvas>
      <div class="hint">Перетаскивайте мышкой • Колёсико — зум</div>
    </div>

    <div class="controls glass">
      <div class="control-group">
        <label for="iterations">
          Точность (макс. итерации): <span id="iterations-value">100</span>
        </label>
        <input type="range" id="iterations" min="10" max="2000" value="100" />
      </div>

      <div class="control-group">
        <button id="reset-btn" type="button">Сбросить вид</button>
      </div>

      <div class="info">
        <div><span class="label">Центр:</span> <span id="coords">-0.50, 0.00</span></div>
        <div><span class="label">Масштаб:</span> <span id="scale">1.00×</span></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
